[phases.setup]
nixPkgs = ["...", "python3Packages.pip", "nodejs_20"]

[phases.install]
cmds = [
    "python3 -m pip install -r requirements.txt",
    "cd frontend && npm install && npm run build",
    "python3 ml/train_pipeline.py"
]

[start]
cmd = "python3 -m uvicorn api:app --host 0.0.0.0 --port ${PORT:-8000}"
